<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Desert Dive</title>
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0, minimum-scale=1, maximum-scale=1, minimal-ui">

        <style type="text/css">
            html, body, #game_div {
                margin: 0px;
                padding: 0px;
                width: 100%;
                height: 100%;
                background-color: #000;
            }

            #wrapper {
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                height: 100vh;
                text-align: center;
                background-color: #000;
            }

            #game_div {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            canvas {
                display: block !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }
        </style>
    </head>

    <body>
        <div id="wrapper"><div id="game_div"></div></div>

        <script src="main.js" type="text/javascript" charset="utf-8"></script>

        <script type="text/javascript">
            game.on("loaded", function(config) {
                document.title = config?.name || "Desert Dive";
            });

            game.emit("boot", false);
        </script>
    </body>
</html>
